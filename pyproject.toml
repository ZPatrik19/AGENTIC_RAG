[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dap-life-events-assistant"
version = "0.1.0"
description = "Independent Hungarian life-events Agentic RAG prototype"
requires-python = ">=3.12,<3.15"
dependencies = [
  "langgraph>=0.6,<2",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "beautifulsoup4>=4.12,<5",
  "PyMuPDF>=1.24,<2",
  "streamlit>=1.40,<2",
  "python-dotenv>=1,<2",
  "plotly>=5.22,<7",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
rag = ["qdrant-client>=1.12,<3", "sentence-transformers>=3,<6", "truststore>=0.10,<1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
dap-documents = "dap_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: requires installed app integrations (never calls paid APIs)",
  "slow: time-consuming local tests",
]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
