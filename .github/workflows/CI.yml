name: "CitizenFlow AI · Quality → Graph → Package → Docker"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_docker:
        description: "Build the Docker image and run an offline Streamlit smoke test"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: citizenflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never calls Ollama, Hugging Face, government websites, or paid APIs.
  LLM_PROVIDER: dummy
  EMBEDDING_PROVIDER: dummy
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  preflight:
    name: "00 · Preflight & repository contract"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify required project paths and Python compatibility
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          manifest = tomllib.loads((root / 'pyproject.toml').read_text(encoding='utf-8'))
          assert manifest['project']['requires-python'] == '>=3.12,<3.15'
          required = (
              'README.md', '.env.example', '.gitignore', 'Dockerfile',
              'docker-compose.yml', 'config/document_sources.yaml',
              'evaluation/golden_v4.json',
              'src/dap_assistant/workflow.py', 'src/dap_assistant/rag/rag_graph.py',
              'tests/agent/test_graph_integration.py',
              'tests/agent/test_mock_graph_integration.py',
          )
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit('Missing required paths: ' + ', '.join(missing))
          print('Repository contract and supported Python range: OK')
          PY
      - name: Verify ignored secrets and generated corpora
        shell: bash
        run: |
          git check-ignore --no-index -q .env
          git check-ignore --no-index -q .venv/pyvenv.cfg
          git check-ignore --no-index -q data/raw/vehicle/example.html
          git check-ignore --no-index -q data/vectorstore/index.db
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo '::error::.env is tracked by Git'
            exit 1
          fi
      - name: Parse repository configuration
        shell: bash
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python - <<'PY'
          import json
          import pathlib
          import tomllib
          import yaml

          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or any(part in {'.git', '.venv', '.pytest_cache'} for part in path.parts):
                  continue
              if path.suffix in ('.yml', '.yaml'):
                  list(yaml.safe_load_all(path.read_text(encoding='utf-8')))
              elif path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8'))
              elif path.suffix == '.toml':
                  tomllib.loads(path.read_text(encoding='utf-8'))
          print('YAML / JSON / TOML: OK')
          PY
      - name: Validate local shell launchers
        shell: bash
        run: |
          bash -n setup.sh
          bash -n run.sh

  repository-quality:
    name: "01 · Architecture & repository audit"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: AST / import-boundary audit
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit_project.py | tee repository-audit.json
      - name: Compile all Python code
        run: python -m compileall -q src scripts tests
      - name: Upload architecture audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-audit
          path: repository-audit.json
          if-no-files-found: warn
          retention-days: 14

  code-quality:
    name: "02 · Ruff critical lint"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install code-quality tooling
        run: python -m pip install -e '.[dev]'
      # Existing source is not yet fully Ruff-formatted; do not claim a full style gate.
      - name: Ruff syntax, undefined names, and critical errors
        run: python -m ruff check --select E4,E7,E9,F src scripts tests
      - name: Dependency consistency
        run: python -m pip check

  offline-tests:
    name: "03 · Offline pytest / Python ${{ matrix.python-version }}"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and tests without optional ML weights
        run: python -m pip install -e '.[dev]'
      - name: Require installed LangGraph (skip is not a pass)
        run: python -c "from langgraph.graph import StateGraph; from langgraph.checkpoint.memory import InMemorySaver; print('LangGraph installed')"
      - name: Run the complete offline test suite
        run: python -m pytest -q --junitxml=pytest-${{ matrix.python-version }}.xml
      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-python-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

  graph-integration:
    name: "04 · Real LangGraph / mocked Ollama integration"
    needs: [code-quality, offline-tests, repository-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real graph runtime (no external model)
        run: python -m pip install -e '.[dev]'
      - name: Ensure integration dependencies are installed
        run: python -c "from langgraph.graph import StateGraph; from langgraph.checkpoint.memory import InMemorySaver; import httpx; print('Real graph and mocked HTTP ready')"
      - name: Run the main graph and RAG subgraph
        run: |
          python -m pytest -q \
            tests/agent/test_graph_integration.py \
            tests/agent/test_mock_graph_integration.py \
            tests/agent/test_native_tool_calling_graph.py \
            --junitxml=graph-integration.xml
      - name: Upload graph results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graph-integration-results
          path: graph-integration.xml
          if-no-files-found: warn
          retention-days: 14

  dependency-security:
    name: "05 · Dependency audit & tracked secret filenames"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Reject tracked private credentials
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import subprocess

          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          forbidden = {'.env', '.env.local', '.env.production', 'credentials.json', 'secrets.json',
                       'id_rsa', 'id_ed25519'}
          bad = [name for name in files if pathlib.PurePosixPath(name).name.lower() in forbidden
                 or pathlib.PurePosixPath(name).suffix.lower() in {'.pem', '.p12', '.pfx'}]
          if bad:
              raise SystemExit('Potentially sensitive tracked filenames: ' + ', '.join(bad))
          print('Tracked filename check: OK (not a content-based secret scan)')
          PY
      - name: Install application and dependency auditor
        run: python -m pip install -e '.[dev]' pip-audit
      - name: Audit installed Python dependencies for known vulnerabilities
        run: python -m pip_audit --skip-editable

  package-build:
    name: "06 · Build distributable Python package"
    needs: [code-quality, offline-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and validate distribution metadata
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Upload wheel and source distribution
        uses: actions/upload-artifact@v7
        with:
          name: citizenflow-python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  docker-smoke:
    name: "07 · Docker / Streamlit offline smoke (manual opt-in)"
    if: github.event_name == 'workflow_dispatch' && inputs.run_docker == true
    needs: [graph-integration, package-build, dependency-security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build full application image (no model weights downloaded)
        run: docker compose build assistant
      - name: Check CLI in an isolated dummy container
        run: |
          docker compose run --rm --no-deps \
            -e LLM_PROVIDER=dummy -e EMBEDDING_PROVIDER=dummy \
            assistant python -m dap_assistant.cli status
      - name: Start Streamlit with dummy providers
        shell: bash
        run: |
          LLM_PROVIDER=dummy EMBEDDING_PROVIDER=dummy docker compose up -d --no-deps assistant
          for attempt in $(seq 1 60); do
            if ! docker compose ps --status running --services | grep -qx assistant; then
              docker compose logs assistant
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health >/dev/null 2>&1; then
              echo 'Streamlit health endpoint: OK (not an Ollama/RAG quality check)'
              exit 0
            fi
            sleep 2
          done
          docker compose logs assistant
          exit 1
      - name: Container logs after failure
        if: failure()
        run: docker compose logs assistant || true
      - name: Stop and remove CI containers
        if: always()
        run: docker compose down --remove-orphans || true

  final-gate:
    name: "08 · Required CI gate"
    if: always()
    needs:
      - preflight
      - repository-quality
      - code-quality
      - offline-tests
      - graph-integration
      - dependency-security
      - package-build
      - docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject failed, cancelled, or unexpectedly skipped jobs
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          REPOSITORY: ${{ needs.repository-quality.result }}
          QUALITY: ${{ needs.code-quality.result }}
          TESTS: ${{ needs.offline-tests.result }}
          GRAPH: ${{ needs.graph-integration.result }}
          SECURITY: ${{ needs.dependency-security.result }}
          PACKAGE: ${{ needs.package-build.result }}
          DOCKER: ${{ needs.docker-smoke.result }}
          EVENT: ${{ github.event_name }}
          RUN_DOCKER: ${{ inputs.run_docker || false }}
        shell: bash
        run: |
          failed=0
          check_required() {
            if [[ "$2" != success ]]; then
              echo "::error::$1 ended with $2 (required: success)"
              failed=1
            else
              echo "OK: $1"
            fi
          }
          check_required preflight "$PREFLIGHT"
          check_required repository-quality "$REPOSITORY"
          check_required code-quality "$QUALITY"
          check_required offline-tests "$TESTS"
          check_required graph-integration "$GRAPH"
          check_required dependency-security "$SECURITY"
          check_required package-build "$PACKAGE"
          if [[ "$EVENT" == workflow_dispatch && "$RUN_DOCKER" == true ]]; then
            check_required docker-smoke "$DOCKER"
          elif [[ "$DOCKER" != skipped ]]; then
            echo "::error::docker-smoke should be skipped unless manually selected; got $DOCKER"
            failed=1
          else
            echo 'OK: docker-smoke intentionally not requested'
          fi
          exit "$failed"

